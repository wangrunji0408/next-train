<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0D0E11" media="(prefers-color-scheme: dark)">
    <title>下班车时间</title>
    <script>
        // 在首帧渲染前应用已保存的主题，避免闪烁
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        })();
    </script>
    <style>
        :root {
            color-scheme: light dark;

            /* 浅色回退值（不支持 light-dark() 的旧浏览器） */
            --bg: #F6F6F4;
            --surface: #FFFFFF;
            --surface-2: #EFEFEC;
            --text: #17181A;
            --text-2: #77797F;
            --border: rgba(23, 24, 26, 0.09);
            --shadow: 0 1px 2px rgba(23, 24, 26, 0.04), 0 8px 24px rgba(23, 24, 26, 0.05);
            --danger: #C64541;

            --bg: light-dark(#F6F6F4, #0D0E11);
            --surface: light-dark(#FFFFFF, #16181D);
            --surface-2: light-dark(#EFEFEC, #1E2128);
            --text: light-dark(#17181A, #ECEDEF);
            --text-2: light-dark(#77797F, #94979F);
            --border: light-dark(rgba(23, 24, 26, 0.09), rgba(236, 237, 239, 0.1));
            --danger: light-dark(#C64541, #F07470);

            /* 由 app.js 根据所选线路更新 */
            --line-color: #8A8D93;

            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-digits: "DIN Alternate", "Bahnschrift", ui-monospace, "SF Mono",
                "Cascadia Code", Menlo, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
            }
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --shadow: 0 1px 2px rgba(23, 24, 26, 0.04), 0 8px 24px rgba(23, 24, 26, 0.05);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding: 16px 20px calc(24px + env(safe-area-inset-bottom));
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--line-color);
            outline-offset: 2px;
        }

        .topbar {
            max-width: 420px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--line-color);
            transition: background-color 0.3s ease;
        }

        .brand h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .topbar-controls {
            display: flex;
            gap: 8px;
        }

        .chip-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            min-width: 32px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text-2);
            font-size: 13px;
            transition: color 0.2s ease, border-color 0.2s ease, background-color 0.3s ease;
        }

        .chip-btn:hover {
            color: var(--text);
            border-color: var(--text-2);
        }

        .chip-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        /* ---- 加载与错误 ---- */

        .loading {
            text-align: center;
            font-size: 15px;
            color: var(--text-2);
            padding: 64px 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .error {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 24px 20px;
            font-size: 15px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .error.error-state {
            color: var(--danger);
            text-align: center;
        }

        /* app.js 动态生成的搜索 / 列表控件 */

        .station-input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            margin-bottom: 10px;
        }

        .station-input::placeholder {
            color: var(--text-2);
        }

        .list-btn {
            display: block;
            width: 100%;
            margin: 6px 0;
            padding: 13px 16px;
            background: var(--surface-2);
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            text-align: left;
            transition: border-color 0.15s ease;
        }

        .list-btn:hover {
            border-color: var(--text-2);
        }

        .back-btn {
            margin-top: 16px;
            padding: 11px 28px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text-2);
            font-size: 14px;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .back-btn:hover {
            color: var(--text);
            border-color: var(--text-2);
        }

        .panel-hint {
            color: var(--text-2);
            margin-bottom: 16px;
            text-align: center;
        }

        /* ---- 主界面 ---- */

        #app > * {
            animation: rise 0.45s ease backwards;
        }

        #app > :nth-child(2) { animation-delay: 0.05s; }
        #app > :nth-child(3) { animation-delay: 0.1s; }
        #app > :nth-child(4) { animation-delay: 0.15s; }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
        }

        .station-info {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 16px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .station-name {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.01em;
            margin-bottom: 4px;
            padding-right: 88px;
        }

        .distance {
            font-size: 13px;
            color: var(--text-2);
        }

        .station-controls {
            position: absolute;
            top: 20px;
            right: 16px;
            display: flex;
            gap: 8px;
        }

        .station-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: none;
            color: var(--text-2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .station-btn:hover {
            color: var(--text);
            border-color: var(--text-2);
        }

        .station-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 站名编辑态（app.js 动态创建） */

        .station-edit-input {
            width: 100%;
            padding: 2px 8px;
            border: none;
            border-bottom: 2px solid var(--line-color);
            border-radius: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 26px;
            font-weight: 600;
            outline: none;
        }

        .station-search-results {
            position: fixed;
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-height: 240px;
            overflow-y: auto;
            z-index: 99999;
        }

        .search-result-item {
            padding: 12px 16px;
            font-size: 15px;
            color: var(--text);
            cursor: pointer;
        }

        .search-result-item:hover {
            background: var(--surface-2);
        }

        .search-result-item + .search-result-item {
            border-top: 1px solid var(--border);
        }

        /* ---- 线路与方向 ---- */

        .line-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .line-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.2s ease, border-color 0.2s ease,
                color 0.2s ease, transform 0.15s ease;
        }

        .line-btn::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--line-color);
            flex-shrink: 0;
        }

        .line-btn:hover {
            border-color: var(--line-color);
        }

        .line-btn:active {
            transform: scale(0.96);
        }

        .line-btn.active {
            background: var(--line-color);
            border-color: var(--line-color);
            color: #fff;
        }

        .line-btn.active::before {
            background: rgba(255, 255, 255, 0.9);
        }

        .direction-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .direction-btn {
            flex: 1;
            padding: 13px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text-2);
            font-size: 14px;
            transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .direction-btn:hover {
            color: var(--text);
        }

        .direction-btn.active {
            border-color: var(--line-color);
            color: var(--text);
            font-weight: 500;
            box-shadow: inset 0 0 0 1px var(--line-color);
        }

        /* ---- 下班车 ---- */

        .next-train {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 44px 56px;
            text-align: center;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .next-train::before {
            content: '';
            position: absolute;
            top: 0;
            left: 24px;
            right: 24px;
            height: 3px;
            border-radius: 0 0 3px 3px;
            background: var(--line-color);
            transition: background-color 0.3s ease;
        }

        .click-indicators {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .click-indicator {
            pointer-events: all;
            width: 44px;
            height: 64px;
            border: none;
            background: none;
            color: var(--text-2);
            font-size: 28px;
            font-weight: 300;
            opacity: 0.5;
            user-select: none;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }

        .click-indicator:hover {
            opacity: 1;
        }

        .click-indicator:active {
            transform: scale(0.85);
        }

        .time-wrap {
            position: relative;
            display: inline-block;
        }

        .train-time {
            font-family: var(--font-digits);
            font-variant-numeric: tabular-nums;
            font-size: 72px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.01em;
            margin-bottom: 12px;
            transition: opacity 0.3s ease;
        }

        .train-time.departed {
            opacity: 0.35;
            text-decoration: line-through;
            text-decoration-thickness: 3px;
        }

        .train-tag {
            display: none;
            position: absolute;
            top: -4px;
            right: -30px;
            padding: 2px 7px;
            border: 1px solid var(--line-color);
            border-radius: 6px;
            color: var(--line-color);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
        }

        .countdown {
            font-size: 15px;
            color: var(--text-2);
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }

        .countdown.departed {
            color: var(--danger);
            font-weight: 500;
        }

        /* ---- 移动端 ---- */

        @media screen and (max-width: 600px) {
            html, body {
                touch-action: pan-y;
            }

            body {
                padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
            }

            .topbar {
                margin-bottom: 20px;
            }

            .train-time {
                font-size: 60px;
            }

            .next-train {
                padding: 40px 48px;
            }

            .click-indicator {
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1 data-i18n="appTitle">下班车时间</h1>
        </div>
        <div class="topbar-controls">
            <button class="chip-btn" id="themeToggle" aria-label="切换深浅主题"></button>
            <button class="chip-btn" id="languageSelector">
                <span id="currentLanguage">中文</span>
            </button>
        </div>
    </header>

    <main class="container">
        <div id="loading" class="loading" data-i18n="locating">
            正在定位中...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="app" style="display: none;">
            <div class="station-info">
                <div class="station-name-container">
                    <div class="station-name" id="stationName"></div>
                </div>
                <div class="distance" id="distance"></div>
                <div class="station-controls">
                    <button class="station-btn" id="sortByDistanceBtn" data-i18n-title="selectByDistance" title="按距离选择站点" aria-label="按距离选择站点">
                        <svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-10a6.5 6.5 0 1 1 13 0c0 4.4-6.5 10-6.5 10z"/><circle cx="12" cy="11" r="2.5"/></svg>
                    </button>
                    <button class="station-btn" id="inputStationBtn" data-i18n-title="searchStation" title="输入站名" aria-label="输入站名">
                        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
                    </button>
                </div>
            </div>

            <div class="line-selector" id="lineSelector"></div>

            <div class="direction-selector" id="directionSelector"></div>

            <div class="next-train">
                <div class="click-indicators">
                    <button class="click-indicator left" aria-label="上一班">‹</button>
                    <button class="click-indicator right" aria-label="下一班">›</button>
                </div>
                <div class="time-wrap">
                    <div class="train-time" id="trainTime">--:--</div>
                    <div class="train-tag" id="trainTag"></div>
                </div>
                <div class="countdown" id="countdown" data-i18n="calculating">计算中...</div>
            </div>
        </div>
    </main>

    <script>
        // 主题切换：跟随系统，手动切换后记忆
        (function () {
            var btn = document.getElementById('themeToggle');
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            var sunIcon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
            var moonIcon = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

            function effectiveTheme() {
                return document.documentElement.dataset.theme ||
                    (media.matches ? 'dark' : 'light');
            }

            function updateIcon() {
                btn.innerHTML = effectiveTheme() === 'dark' ? sunIcon : moonIcon;
            }

            btn.addEventListener('click', function () {
                var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.theme = next;
                localStorage.setItem('theme', next);
                updateIcon();
            });

            media.addEventListener('change', updateIcon);
            updateIcon();
        })();
    </script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
</body>
</html>
